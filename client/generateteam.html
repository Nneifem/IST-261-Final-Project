<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="styles/team.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <title>Generate Team</title>
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" id="home-link" href="homepage.html">Honkai Star Rail Team Match</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" id="view-team" href="viewteam.html">View Team</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="login.html">Sign out</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    </nav>
    <h3 class="sub-title">Your Generated Team:</h3>
    <div id="team-container">
        <div id="team-explanation"></div>
    </div>
    <button id="save-generate-team-btn" type="button" class="btn btn-primary">Save team</button>

    
    <!-- Script code -->
    <script>
            const urlParams = new URLSearchParams(window.location.search);
            const username = urlParams.get("username");
            const USER_CHARACTER_URL = `http://localhost:8080/api/players/${username}/characters`;
            const CHARACTER_URL = 'http://localhost:8080/api/characters/sync';
            const SAVE_TEAM_URL = 'http://localhost:8080/api/teams/generate';
            const teamContainer = document.getElementById("team-container");
            const saveButton = document.getElementById("save-generate-team-btn");
            const teamExplanation = document.getElementById("team-explanation");
            document.getElementById("home-link").href = `homepage.html?username=${encodeURIComponent(username)}`;

            let generatedTeam = [];

        async function generatePlayersTeam() {
            try {
                const allRes = await fetch(CHARACTER_URL);
                const allCharacters = await allRes.json();

                const userRes = await fetch(USER_CHARACTER_URL);
                if(!userRes.ok) throw new Error("Failed to fethc user characters");
                const selectCharacters = await userRes.json();

                if (selectCharacters.length === 0) {
                    teamContainer.innerHTML = "<p>No characters selected. Go select characters<br><a href='homepage.html'>Pick your characters</a></p>";
                    return;
                }

                    const userCharacters = allCharacters.filter(c => selectCharacters.includes(c.characterName));
                    const team = [];

                    const healer = userCharacters.find(c => c.characterPath === "Abundance");
                    const shielder = userCharacters.find(c => c.characterPath === "Preservation");
                    const buffer = userCharacters.find(c => c.characterPath === "Harmony" || c.characterPath === "Remembrance");
                    const dot = userCharacters.find(c => c.characterPath === "Nihility");
                    const dps = userCharacters.find(c => c.characterPath === "Destruction" || c.characterPath === "Hunt" || c.characterPath === "Remembrance");

                    [healer, shielder, buffer, dot, dps].forEach(c => {
                        if (c && !team.includes(c)) team.push(c);
                    });

                    userCharacters.forEach(c => {
                        if (team.length >= 4) return;
                        if (!team.includes(c)) team.push(c);
                    });

                    generatedTeam = team;

                    const teamDiv = document.createElement("div");
                        teamDiv.classList.add("team-container");

                    const cardRow = document.createElement("div");
                    cardRow.classList.add("card-row");

                    team.forEach(char => {
                        const div = document.createElement("div");
                        div.classList.add("col-sm-3");
                        div.innerHTML = `
                        <div class="card" style="height: 100%; width: 90%">
                            <img class="card-img-top" src="${char.img}">
                            <div class="card-body">
                                <h5 class="card-title">${char.characterName}</h5>
                                <p class="card-text">Path: ${char.characterPath}</p>
                                <p class="card-text">Element: ${char.characterElement}</p>
                                <p class="card-text">Rarity: ${char.characterRarity}</p>
                            </div>
                        </div>
                        `;
                        cardRow.appendChild(div);
                    });
                    teamDiv.appendChild(cardRow);
                    teamContainer.appendChild(teamDiv);

                    const paths = new Set(team.map(c => c.characterPath));
                    const elements = new Set(team.map(c => c.characterElement));

                    let explanation = `This team contains ${team.length} characters.\n`;
                    explanation += `Elements: ${Array.from(elements).join(", ")}.\n`;
                    explanation += `Paths: ${Array.from(paths).join(", ")}.\n`;

                    if (paths.has("Abundance")) explanation += "Has a healer. ";
                    if (paths.has("Preservation")) explanation += "Has a shielder. ";
                    if (paths.has("Harmony")) explanation += "Has a buffer. ";
                    if (paths.has("Nihility")) explanation += "Has a debuffer. ";
                    if (paths.has("Destruction") || paths.has("Hunt")) explanation += "Has at least one DPS. ";

                    explanation += "Balance team for the main story quest.";
                    teamExplanation.textContent = explanation;

                    // saving the generated team
                    saveButton.addEventListener("click", async () => {
                        try {
                            const teamNames = generatedTeam.map(c => c.characterName);
                            const response = await fetch(`${SAVE_TEAM_URL}/${username}`, {
                                method: "POST",
                                headers: {"Content-Type": "application/json"},
                                body: JSON.stringify(teamNames)
                            });

                            if(!response.ok) throw new Error("Failed to save team.");

                            const savedTeam = await response.json();
                            alert("Team saved successfully");
                            window.location.href = `viewteam.html?username=${encodeURIComponent(username)}`;
                        } catch (err) {
                            console.error(err);
                            alert("Failed to load team")
                        }
                    });
                } catch (err) {
                    console.error(err);
                }
            }
            document.addEventListener("DOMContentLoaded", generatePlayersTeam);
    </script>
</body>
</html>
