<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="styles/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <title>Homepage</title>
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" id="home-link" href="homepage.html">Honkai Star Rail Team Match</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" id="view-team" href="viewteam.html">View Team</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="login.html">Sign out</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <h3 class="sub-title">Select the characters you own:</h3>

    <div class="container">
        <div id="characters-container" class="row justtify-content-center"></div>
        <button id="generate-team-btn" type="button" class="btn btn-primary">Generate team</button>
    </div>

    
    
    <!-- Script code -->
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const username = urlParams.get("username");
        const viewTeamLink = document.getElementById("view-team");
        const CHARACTER_URL = 'http://localhost:8080/api/characters/sync';
        const SAVE_CHARACTERS_URL = `http://localhost:8080/api/players/${username}/characters`;
        const selectCharacters = new Set();
        const characterList = document.getElementById('characters-container');
        const generateTeam = document.getElementById("generate-team-btn");

        if (!username) {
            alert("Username is not logged. Please login first.");
            window.location.href = "login.html";
        }
        document.getElementById("home-link").href = `homepage.html?username=${encodeURIComponent(username)}`;
        
        viewTeamLink.href = `viewteam.html?username=${encodeURIComponent(username)}`;
        // loading the characters
        async function loadCharacters() {
            try {
                const response = await fetch(CHARACTER_URL);
                if (!response.ok) throw new Error("Failed to load characters.");
                const characters = await response.json();
                characterList.innerHTML = '';

                characters.forEach(char => {
                    const charDiv = document.createElement('div');
                    charDiv.classList.add('col-sm-3');

                    charDiv.innerHTML = `
                        <div class="card" style="height: 100%; width: 90%">
                            <img class="card-img-top" src="${char.img}">
                            <div class="card-body">
                                <h5 class="card-title">${char.characterName}</h5>
                                <p class="card-text">Path: ${char.characterPath}</p>
                                <p class="card-text">Element: ${char.characterElement}</p>
                                <p class="card-text">Rarity: ${char.characterRarity}</p>
                            </div>
                            <div class="button-container">
                                <button type="button" class="btn btn-primary">Add</button>
                            </div>
                        </div>
                    `;

                    charDiv.querySelector('.card').addEventListener('click', () => {
                        if (selectCharacters.has(char.characterName)) {
                            selectCharacters.delete(char.characterName);
                            charDiv.querySelector('.card').classList.remove('selected');
                        } else {
                            selectCharacters.add(char.characterName);
                            charDiv.querySelector('.card').classList.add('selected');
                            alert(`${char.characterName} has been added`);
                        }
                    });
                    characterList.appendChild(charDiv);
                });
            } catch (error) {
                console.error(error);
                alert("Error loading characters");
            }
        }
        document.addEventListener('DOMContentLoaded', loadCharacters);

        // saving the selected characters and generating team
        generateTeam.addEventListener('click', async () => {
            if (selectCharacters.size < 4) {
                alert("Please select at least 4 character!");
                return;
            }


            try {
                const response = await fetch(SAVE_CHARACTERS_URL, {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({characters: Array.from(selectCharacters)})
                });
                if (!response.ok) {
                    throw new Error("Failed to save characters.");
                }
                alert("Charactesr saved succfessfully!");
                window.location.href = `generateteam.html?username=${encodeURIComponent(username)}`;
            } catch (error) {
                console.error(error);
            }
        });
    </script>
</body>
</html>
