<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="styles/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <title>Sign Up</title>
</head>
<body>
    <!-- Sign up Form -->
    <h1 class="card-title text-center mb-4">Sign up</h1>
    <form id="signUp">
        <div class="mb-3">
            <label for="userEmail" class="form-label">Email</label>
            <input type="email" autofocus class="form-control" id="email-input" placeholder="Email" required>
        </div>
        <div class="mb-3">
            <label for="userUsername" class="form-label">Username</label>
            <input type="text" class="form-control" id="username-input" placeholder="Username" required>
        </div>
        <div class="mb-3">
            <label for="userPassword" class="form-label">Password</label>
            <input type="password" class="form-control" id="password-input" aria-describedby="passwordHelp" placeholder="Password" required>
            <div id="passwordHelp" class="form-text">Password must be longer than 8 characters</div>
        </div>
        <div class="mb-3">
            <label for="userPassword" class="form-label">Confirm Password</label>
            <input type="password" class="form-control" id="confirm-password-input" placeholder="Password" required>
        </div>
        <button type="submit" class="btn btn-primary">Sign Up</button>
        <p class="login-link">Already have an account? <a href="login.html">Login</a></p>
    </form>
         
       

    <!-- Script code -->
    <script>
        const SIGNUP_URL = 'http://localhost:8080/api/players/signup';

        document.getElementById("signUp").addEventListener("submit", async function(e) {
            e.preventDefault();

            const email = document.getElementById('email-input');
            const username = document.getElementById('username-input');
            const password = document.getElementById('password-input');
            const confirmPassword = document.getElementById('confirm-password-input');

            // making sure the password is longer than 8 characters
            if (password.value.length < 8) {
                alert("Password must be at least 8 characters long.");
                return;
            }
            
            // confirming the passwords match
            if (password.value !== confirmPassword.value) {
                alert("Passwords do not match!");
                return;
            }

            const playerData = {
                username: username.value, 
                email: email.value,
                password: password.value
            };

            try {
                const response = await fetch(SIGNUP_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(playerData)
                });
                if (response.ok) {
                    alert("Account created successfully!");
                    window.location.href = 'login.html';
                } 
                else {
                    alert("Signup failed, please try again.");
                }
            } catch (error) {
                console.error(error);
            }
        });
    </script>
</body>
</html>
