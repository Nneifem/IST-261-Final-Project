<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="styles/team.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <title>Character list</title>
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" id="home-link" href="homepage.html">Honkai Star Rail Team Match</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" id="view-team" href="viewteam.html">View Team</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="login.html">Sign out</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <h3 class="view-team-title">Saved team(s):</h3>
    <div id="saved-team"></div>

    
    <!-- Script code -->
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const username = urlParams.get("username");
        const saved = document.getElementById("saved-team");
        document.getElementById("home-link").href = `homepage.html?username=${encodeURIComponent(username)}`;

        async function loadTeam() {
            try {
                const response = await fetch(`http://localhost:8080/api/players/${username}/teams`);
                if (!response.ok) throw new Error("Failed to load teams");

                const teams = await response.json();
                saved.innerHTML = "";

                if (teams.length === 0) {
                    saved.innerHTML = `<p>No teams have been generated. Go select characters<br><a href='homepage.html?username=${encodeURIComponent(username)}'>Pick your characters</a></p>`;
                    return;
                }
 
                teams.forEach(team => {
                    const teamDiv = document.createElement("div");
                    teamDiv.classList.add("team-container");
                    
                    const cardRow = document.createElement("div");
                    cardRow.classList.add("card-row");

                    team.characters.forEach(char => {
                        const charDiv = document.createElement("div");
                        charDiv.classList.add("col-sm-3");
                        charDiv.innerHTML = `
                            <div class="card" style="height: 100%; width: 90%">
                                <img class="card-img-top" src="${char.img}">
                                <div class="card-body">
                                    <h5 class="card-title">${char.characterName}</h5>
                                    <p class="card-text">Path: ${char.characterPath}</p>
                                    <p class="card-text">Element: ${char.characterElement}</p>
                                    <p class="card-text">Rarity: ${char.characterRarity}</p>
                                </div>
                            </div>
                        `;
                        cardRow.appendChild(charDiv);
                    });
                    teamDiv.appendChild(cardRow);
                    
                    const deleteButton = document.createElement("button");
                    deleteButton.classList.add("btn", "delete-btn");
                    deleteButton.textContent = "Delete Team";
                    teamDiv.appendChild(deleteButton);

                    saved.appendChild(teamDiv);

                    deleteButton.addEventListener("click", async () => {
                        if (confirm(`Are you sure you want to delete ${team.teamName}`)) {
                            try {
                                const delResponse = await fetch(`http://localhost:8080/api/teams/${team.teamId}`, {method: "DELETE"});
                                if (delResponse.status === 204) {
                                    alert("Team deleted successfully!");
                                    loadTeam();
                                } else {
                                    alert("Failed to delete team")
                                }
                            } catch (err) {
                                console.error(err);
                            }
                        }
                    })
                });
                } catch (error) {
                    console.error(error);
                    document.getElementById("saved-team").innerHTML = "<p>Error loading teams.</p>"
                }
            }
            document.addEventListener("DOMContentLoaded", loadTeam);
    </script>
</body>
</html>
