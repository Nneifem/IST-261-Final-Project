<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="styles/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <title>Login</title>
</head>
<body>
    <!-- Login Form-->
    <h1 class="card-title text-center mb-4">Login</h1>
    <form id="login">
        <div class="mb-3">
            <label for="userUsername" class="form-label">Username</label>
            <input type="text" class="form-control" id="username-input" placeholder="Username" required>
        </div>
        <div class="mb-3">
            <label for="userPassword" class="form-label">Password</label>
            <input type="password" class="form-control" id="password-input" placeholder="Password" required>
        </div>
        <button type="submit" class="btn btn-primary">Login</button>
        <p class="login-link">Don't have an account? <a href="signup.html">Sign up</a></p>
    </form>

    <!-- Script code -->
    <script>
        const LOGIN_URL = 'http://localhost:8080/api/players/login';

        document.getElementById("login").addEventListener("submit", async function(e) {
            e.preventDefault();

            const usernameValue = document.getElementById('username-input').value;
            const passwordValue = document.getElementById('password-input').value;

            if (!usernameValue || !passwordValue) {
                alert("All fields are required!");
            }

            try {
                const response = await fetch(LOGIN_URL, {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({username: usernameValue, password: passwordValue})
                });
                if (!response.ok) {
                    const msg = await response.text();
                    alert(msg || "Invalid login");
                    return;
                }

                const data = await response.json();
                alert("Login successful!");
                window.location.href = `homepage.html?username=${encodeURIComponent(usernameValue)}`;

            } catch (error) {
                console.error(error);
            }
        });
    </script>
</body>
</html>
